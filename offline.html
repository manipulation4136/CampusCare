<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CampusCare</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="login-wrapper">

    <div class="ambient-glow"></div>

    <div class="glass-card" style="text-align: center;">

        <div class="hero-icon" style="margin: 0 auto 20px auto; width: 80px; height: 80px; font-size: 40px;">
            📡
        </div>

        <div class="login-header">
            <h1>Connection Lost</h1>
            <p>You seem to be offline.</p>
        </div>

        <div id="admin-msg" class="hidden">
            <div class="alert error" style="margin-bottom: 20px;">
                Admin access requires an internet connection.
            </div>
            <button onclick="window.location.reload()" class="btn" style="width: 100%;">
                🔄 Try Reconnecting
            </button>
        </div>

        <div id="student-msg" class="hidden">
            <div class="alert success"
                style="margin-bottom: 20px; background: rgba(39, 174, 96, 0.1); border-color: rgba(39, 174, 96, 0.2);">
                Don't worry! You can still report damages.
            </div>

            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="/views/student/report_new.php" class="btn">
                    📝 Report Damage
                </a>
                <a href="/views/student/dashboard.php" class="btn outline"
                    style="background: transparent; border: 1px solid var(--accent); color: var(--text);">
                    🏠 Go to Dashboard
                </a>
            </div>
        </div>

        <div id="default-msg" class="hidden">
            <p style="color: var(--muted); margin-bottom: 20px;">Please check your internet connection and try again.
            </p>
            <button onclick="window.location.reload()" class="btn" style="width: 100%;">
                🔄 Reload
            </button>
        </div>

    </div>

    <script>
        // Check Role and Show Relevant Message
        const role = localStorage.getItem('userRole');

        // Simple logic to show the right div
        if (role === 'admin' || role === 'faculty') {
            document.getElementById('admin-msg').classList.remove('hidden');
        } else if (role === 'student') {
            document.getElementById('student-msg').classList.remove('hidden');
        } else {
            document.getElementById('default-msg').classList.remove('hidden');
        }
    </script>
</body>

</html>
