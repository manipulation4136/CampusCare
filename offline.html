<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CampusCare</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        body {
            text-align: center;
            padding: 50px;
            font-family: sans-serif;
            color: white;
            background: #1a1a2e;
        }

        .hidden {
            display: none;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>You are Offline 📡</h1>

    <div id="admin-msg" class="hidden">
        <p>Admin/Faculty access requires an internet connection.</p>
        <p>Please connect to Wi-Fi or Mobile Data.</p>
        <button onclick="window.location.reload()" class="btn">Try Reconnecting</button>
    </div>

    <div id="student-msg" class="hidden">
        <p>You can still report damages offline!</p>
        <a href="./views/student/report_new.php" class="btn">Report Damage</a>
        <br><br>
        <a href="./views/student/dashboard.php" class="btn">Go to Dashboard</a>
    </div>

    <div id="default-msg" class="hidden">
        <p>Please check your internet connection.</p>
        <button onclick="window.location.reload()" class="btn">Reload</button>
    </div>

    <script>
        // Check Role and Show Relevant Message
        const role = localStorage.getItem('userRole');

        if (role === 'admin' || role === 'faculty') {
            document.getElementById('admin-msg').classList.remove('hidden');
        } else if (role === 'student') {
            document.getElementById('student-msg').classList.remove('hidden');
        } else {
            document.getElementById('default-msg').classList.remove('hidden');
        }
    </script>
</body>

</html>
