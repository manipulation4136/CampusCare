<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CampusCare: Offline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            touch-action: none;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .header-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(19, 26, 43, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            border-bottom: 1px solid rgba(110, 168, 254, 0.1);
        }

        .app-logo {
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .offline-status {
            color: #e74c3c;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(231, 76, 60, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .ui-layer {
            position: absolute;
            top: 80px;
            left: 20px;
            color: #6ea8fe;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(19, 26, 43, 0.6);
            backdrop-filter: blur(8px);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(110, 168, 254, 0.2);
            display: flex;
            gap: 20px;
        }

        .ui-layer-right {
            position: absolute;
            top: 80px;
            right: 20px;
            color: #f1c40f;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(19, 26, 43, 0.6);
            backdrop-filter: blur(8px);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(241, 196, 15, 0.3);
            display: flex;
            gap: 20px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7em;
            opacity: 0.7;
        }

        .stat-val {
            font-size: 1.2em;
            color: #fff;
        }

        /* --- CHARACTER NAME POPUP STYLE --- */
        #charToast {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(12, 9, 49, 0.527);
            color: #ffae01;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.3rem;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 166, 64, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #charToast.show {
            opacity: 1;
            top: 180px;
            transform: translateX(-50%) scale(1);
        }

        #charToast i {
            color: #e67e22;
        }

        /* ---------------------------------- */

        #startScreen,
        #gameOverModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: none;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        #startScreen h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(110, 168, 254, 0.5);
            margin-bottom: 5px;
        }

        #gameOverModal {
            display: none;
            pointer-events: auto;
            background: rgba(19, 26, 43, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            min-width: 280px;
        }

        button {
            background: linear-gradient(135deg, #6ea8fe, #5d9cec);
            color: #0b1020;
            border: none;
            padding: 15px 40px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 50px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(110, 168, 254, 0.4);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        .manual-retry-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(110, 168, 254, 0.1);
            color: #6ea8fe;
            border: 1px solid rgba(110, 168, 254, 0.3);
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .manual-retry-btn:hover {
            background: rgba(110, 168, 254, 0.2);
        }

        /* Floating Text */
        .floating-text {
            position: absolute;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 5;
            white-space: nowrap;
        }

        .text-bonus {
            color: #f1c40f;
            font-size: 1.5rem;
        }

        .text-room {
            color: #2ecc71;
            font-size: 2rem;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            left: 0;
            top: 30%;
        }

        .text-floor {
            color: #e67e22;
            font-size: 3rem;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            left: 0;
            top: 20%;
            text-shadow: 0 0 20px #e67e22;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }

            20% {
                opacity: 1;
                transform: translateY(0) scale(1.1);
            }

            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <div class="app-logo"><i class="fas fa-graduation-cap"></i> CampusCare</div>
        <div class="offline-status"><i class="fas fa-wifi-slash"></i> Disconnected</div>
    </div>

    <div id="charToast"><i class="fas fa-user-tag"></i> <span id="charNameText">GOVIND</span></div>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="stat-box"><span class="stat-label">FLOOR</span><span class="stat-val" id="floorDisplay">1</span>
        </div>
        <div class="stat-box"><span class="stat-label">ROOM</span><span class="stat-val" id="roomDisplay">101</span>
        </div>
        <div class="stat-box"><span class="stat-label">SCORE</span><span class="stat-val" id="scoreDisplay">0</span>
        </div>
    </div>

    <div class="ui-layer-right">
        <div class="stat-box"><span class="stat-label">BEST</span><span class="stat-val" id="highScoreDisplay">0</span>
        </div>
    </div>

    <div id="startScreen">
        <h1>HALLWAY DASH</h1>
        <p style="color:#6ea8fe; font-weight:bold;">TAP TO START</p>
        <p style="opacity:0.5; font-size:0.8em; margin-top:20px">LEFT: SLIDE | RIGHT: JUMP</p>
    </div>

    <div id="gameOverModal">
        <h2 style="color:#ff4757; margin:0; font-size: 2rem;">BUSTED!</h2>
        <p id="deathReason" style="color:#bdc3c7; margin: 10px 0 20px 0; font-style: italic;">"Principal caught you."
        </p>
        <div style="font-size: 3rem; font-weight: bold;" id="finalScore">0</div>
        <div style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 20px;">TOTAL SCORE</div>
        <button id="retryBtn">TRY AGAIN</button>
    </div>

    <button class="manual-retry-btn" onclick="location.reload()">
        <i class="fas fa-sync-alt"></i> Retry Connection
    </button>

    <audio id="bgMusic" loop src="bg-music.mp3" style="display:none;"></audio>
    <script>
        window.addEventListener('online', () => { location.reload(); });

        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('scoreDisplay');
            const roomEl = document.getElementById('roomDisplay');
            const floorEl = document.getElementById('floorDisplay');
            const highScoreEl = document.getElementById('highScoreDisplay');
            const modal = document.getElementById('gameOverModal');
            const startScreen = document.getElementById('startScreen');
            const retryBtn = document.getElementById('retryBtn');
            const finalScoreEl = document.getElementById('finalScore');
            const deathReasonEl = document.getElementById('deathReason');
            const charToast = document.getElementById('charToast');
            const charNameText = document.getElementById('charNameText');

            const CONFIG = {
                GRAVITY: 0.8,
                JUMP_FORCE: -19,
                SPEED_START: 4,
                SPEED_MAX: 17,
                ROOM_DISTANCE: 300
            };
            const FAIL_MESSAGES = ["Tripped on a wire!", "Principal saw you running!", "Late for the Exam!", "ID Card Missing!", "Caught by the Squad!"];

            const AudioSys = {
                ctx: null,
                init() {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const resume = () => {
                        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                        window.removeEventListener('click', resume);
                        window.removeEventListener('keydown', resume);
                        window.removeEventListener('touchstart', resume);
                    };
                    window.addEventListener('click', resume);
                    window.addEventListener('keydown', resume);
                    window.addEventListener('touchstart', resume);
                },
                playJump() {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(500, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                },
                playSlide() {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                },
                playGameOver() {
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.8);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.8);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.8);
                }
            };
            AudioSys.init();

            function toggleMusic(play) {
                const audio = document.getElementById('bgMusic');
                if (play) {
                    audio.play().catch(e => console.log("Audio play failed (interaction needed):", e));
                } else {
                    audio.pause();
                    audio.currentTime = 0;
                }
            }

            // Added characterIndex to state
            // Added characterIndex to state
            let state = { playing: false, score: 0, visualScore: 0, highScore: parseInt(localStorage.getItem('cc_hallway_hiscore')) || 0, speed: CONFIG.SPEED_START, frame: 0, animDistance: 0, isGameOver: false, roomNumber: 101, floorNumber: 1, nextRoomThreshold: CONFIG.ROOM_DISTANCE, roomsClearedInFloor: 0, bgHue: 220, spawnMilestoneDoor: false, characterIndex: 0, shakeTime: 0, bgPatternQueue: [] };
            highScoreEl.innerText = state.highScore;

            let cw, ch, groundY;

            function resize() {
                const isMobile = innerWidth < 768;
                const zoomFactor = isMobile ? 0.8 : 1;
                cw = canvas.width = innerWidth / zoomFactor;
                ch = canvas.height = innerHeight / zoomFactor;
                groundY = (ch / 2) + 80;
                if (!state.playing && !state.isGameOver) drawStaticScene();
            }
            addEventListener('resize', resize);

            const particles = [];
            function spawnDust(x, y, speed) {
                for (let i = 0; i < 3; i++) {
                    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 2 - speed, vy: (Math.random() - 1) * 2, life: 1.0, size: Math.random() * 3 + 1 });
                }
            }
            function updateAndDrawParticles() {
                ctx.fillStyle = 'rgba(200, 200, 200, 0.5)';
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.05; p.size *= 0.95;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            const bgObjects = [];
            // --- ARCHITECTURAL PATTERN SYSTEM ---
            const HALLWAY_PATTERNS = [
                ['pillar', 'door', 'window', 'window'],       // Classic Classroom
                ['pillar', 'locker', 'locker', 'locker'],     // Locker Area
                ['pillar', 'notice_board', 'door', 'pillar'], // Staff Room / Office
                ['pillar', 'window', 'bench_bg', 'window'],   // Resting Area (bench_bg is visual only)
                ['pillar', 'door', 'fire_ext', 'window']      // Utility Area
            ];

            function spawnBgObject() {
                // 1. മൈൽസ്റ്റോൺ ഡോർ (റൂം നമ്പർ മാറുന്നത്) വരാനുണ്ടെങ്കിൽ അത് ആദ്യം ഇടുക
                if (state.spawnMilestoneDoor) {
                    bgObjects.push({ x: cw + 100, type: 'milestone_door', label: "ROOM " + state.roomNumber });
                    state.spawnMilestoneDoor = false;
                    // പാറ്റേൺ ക്യൂ ക്ലിയർ ചെയ്യുക, പുതിയ റൂം തുടങ്ങുമ്പോൾ ഫ്രഷ് ആയി തുടങ്ങാൻ
                    state.bgPatternQueue = [];
                    return;
                }

                // 2. ക്യൂ കാലിയാണെങ്കിൽ പുതിയൊരു പാറ്റേൺ ലോഡ് ചെയ്യുക
                if (state.bgPatternQueue.length === 0) {
                    const randomPattern = HALLWAY_PATTERNS[Math.floor(Math.random() * HALLWAY_PATTERNS.length)];
                    state.bgPatternQueue = [...randomPattern]; // പാറ്റേൺ ക്യൂവിലേക്ക് മാറ്റുന്നു
                }

                // 3. ക്യൂവിന്റെ മുന്നിൽ നിന്ന് അടുത്ത ഒബ്ജക്റ്റ് എടുക്കുക
                const nextType = state.bgPatternQueue.shift();

                // 4. ഒബ്ജക്റ്റ് സ്പോൺ ചെയ്യുക (Some variations for realism)
                let objWidth = 50; // Default (Pillar)
                if (nextType === 'locker') objWidth = 60;
                if (nextType === 'window') objWidth = 120;
                if (nextType === 'door') objWidth = 90;
                if (nextType === 'notice_board') objWidth = 100;
                if (nextType === 'fire_ext') objWidth = 40;
                if (nextType === 'bench_bg') objWidth = 80;
                if (nextType === 'milestone_door') objWidth = 150;

                // 'empty' ടൈപ്പ് വന്നാൽ ഒന്നും വരക്കണ്ട, വെറും സ്പേസ് മാത്രം
                if (nextType !== 'empty') {
                    bgObjects.push({
                        x: cw + 50,
                        type: nextType,
                        width: objWidth
                    });
                }
            }

            // --- പുതിയ ബാക്ക്ഗ്രൗണ്ട് ഡ്രോയിംഗ് (REALISTIC FEEL) ---
            function drawBackground() {
                // Position-based spawning logic
                const lastObj = bgObjects.length > 0 ? bgObjects[bgObjects.length - 1] : null;
                if (state.playing) {
                    // 50px gap between objects
                    if (!lastObj || (lastObj.x + lastObj.width < cw - 20)) {
                        spawnBgObject();
                    }
                }

                let hue = state.bgHue;

                // 1. പ്രധാന ഭിത്തി (Wall)
                ctx.fillStyle = `hsl(${hue}, 25%, 18%)`; // ഇരുണ്ട നിറം
                ctx.fillRect(0, 0, cw, ch);

                const corridorTop = groundY - 260;
                const corridorHeight = 260;

                // 2. ഭിത്തിയുടെ താഴത്തെ ഭാഗം (Dado / Wainscoting) - കോളേജ് ലുക്ക് കിട്ടാൻ
                ctx.fillStyle = `hsl(${hue}, 20%, 25%)`;
                ctx.fillRect(0, groundY - 100, cw, 100);

                // ബോർഡർ ലൈൻ (Waist line)
                ctx.fillStyle = `hsl(${hue}, 30%, 35%)`;
                ctx.fillRect(0, groundY - 100, cw, 5);

                // 3. തറയും സീലിംഗും തമ്മിലുള്ള ലൈനുകൾ (Depth)
                ctx.fillStyle = `hsl(${hue}, 15%, 10%)`; // സീലിംഗ്
                ctx.fillRect(0, 0, cw, corridorTop);

                ctx.beginPath();
                ctx.strokeStyle = `hsl(${hue}, 10%, 30%)`;
                ctx.lineWidth = 2;
                ctx.moveTo(0, corridorTop);
                ctx.lineTo(cw, corridorTop); // സീലിംഗ് ലൈൻ
                ctx.stroke();

                // 4. ഒബ്ജക്റ്റുകൾ വരയ്ക്കുന്നു
                for (let i = bgObjects.length - 1; i >= 0; i--) {
                    let o = bgObjects[i];
                    if (state.playing) o.x -= state.speed * 0.5; // Parallax effect (പതുക്കെ നീങ്ങുന്നു)

                    const floorLine = groundY;

                    if (o.type === 'pillar') {
                        // കോൺക്രീറ്റ് പില്ലർ
                        ctx.fillStyle = `hsl(${hue}, 15%, 22%)`;
                        ctx.fillRect(o.x, corridorTop, 50, corridorHeight);

                        // പില്ലറിന് ഷേഡിംഗ് (3D Feel)
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.fillRect(o.x + 40, corridorTop, 10, corridorHeight); // നിഴൽ
                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.fillRect(o.x, corridorTop, 10, corridorHeight); // വെളിച്ചം

                    } else if (o.type === 'door') {
                        // ക്ലാസ് റൂം ഡോർ
                        const doorH = 180;
                        const doorY = floorLine - doorH;

                        // ഡോർ ഫ്രെയിം
                        ctx.fillStyle = `hsl(${hue}, 15%, 15%)`;
                        ctx.fillRect(o.x, doorY, 90, doorH);

                        // ഡോർ പാളി
                        ctx.fillStyle = `hsl(${hue}, 20%, 30%)`; // തടിയുടെ കളർ ഫീൽ ചെയ്യാൻ
                        ctx.fillRect(o.x + 5, doorY + 5, 80, doorH - 5);

                        // ഡോർ വിൻഡോ (ഗ്ലാസ്)
                        ctx.fillStyle = `hsl(${hue}, 40%, 10%)`;
                        ctx.fillRect(o.x + 15, doorY + 20, 60, 50);

                        // ഡോർ നോബ് (Handle)
                        ctx.fillStyle = '#bbb';
                        ctx.beginPath(); ctx.arc(o.x + 75, doorY + 100, 3, 0, Math.PI * 2); ctx.fill();

                    } else if (o.type === 'window') {
                        // ജനൽ
                        const winY = corridorTop + 40;
                        const winH = 100;
                        const winW = 120;

                        // ഗ്ലാസ്
                        ctx.fillStyle = `hsl(${hue}, 40%, 15%)`; // രാത്രി ആകാശം
                        ctx.fillRect(o.x, winY, winW, winH);

                        // ജനൽ കമ്പികൾ
                        ctx.fillStyle = `hsl(${hue}, 10%, 20%)`; // ഫ്രെയിം
                        ctx.fillRect(o.x + winW / 2 - 2, winY, 4, winH); // നടുക്കുള്ള വടി
                        ctx.fillRect(o.x, winY + winH / 2 - 2, winW, 4); // കുറുകെയുള്ള വടി

                        // ഗ്ലാസ് റിഫ്ലക്ഷൻ (തിളക്കം)
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.beginPath();
                        ctx.moveTo(o.x + 10, winY + winH);
                        ctx.lineTo(o.x + 40, winY);
                        ctx.lineTo(o.x + 60, winY);
                        ctx.lineTo(o.x + 30, winY + winH);
                        ctx.fill();

                    } else if (o.type === 'locker') {
                        // ലോക്കറുകൾ
                        const lockerH = 160;
                        const lockerY = floorLine - lockerH;
                        const lockerW = 60;

                        ctx.fillStyle = `hsl(${hue}, 10%, 35%)`; // മെറ്റൽ ഗ്രേ
                        ctx.fillRect(o.x, lockerY, lockerW, lockerH);

                        // ലോക്കർ ഡിവിഷൻ (രണ്ട് തട്ട്)

                    } else if (o.type === 'notice_board') {

                        if (!o.papers) { // പേപ്പറുകൾ ഇല്ലെങ്കിൽ ഉണ്ടാക്കുക (One time)

                        ctx.beginPath();
                        ctx.roundRect(o.x + 10, feY, 20, 50, 5); // Modern browsers supports roundRect

                        ctx.fillStyle = '#ecf0f1'; // Label

                        ctx.fillStyle = '#2c3e50'; // Nozzle

                    } else if (o.type === 'bench_bg') {
                        // ബാക്ക്ഗ്രൗണ്ടിൽ ഒരു ബെഞ്ച് (ഇടിക്കാൻ പറ്റാത്തത്)
                        const bY = groundY - 60;

                    } else if (o.type === 'milestone_door') {

                        ctx.shadowBlur = 20; ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
                        ctx.fillStyle = `hsl(${hue}, 40%, 20%)`;
                        // വലിപ്പം കൂട്ടി, ഡബിൾ ഡോർ ആക്കി
                        ctx.fillRect(o.x, groundY - 220, 10, 220); // ഇടത് തൂൺ
                        ctx.fillRect(o.x + 120, groundY - 220, 10, 220); // വലത് തൂൺ

            }

            // --- CHARACTER DEFINITIONS ---
            const characterRoster = [
                {

                {

            const player = {
                x: 60, y: 0, w: 30, h: 50, dy: 0, grounded: false, crouching: false, slideTimer: 0,
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y);

                    // --- DYNAMIC OUTFIT SELECTION ---
                    const charObj = characterRoster[state.characterIndex % characterRoster.length];
                    const colors = charObj.colors;

                    // --- DROP SHADOW ---
                    // Shadow scales down when jumping
                    const distFromGround = (groundY - (this.y + this.h));
                    const shadowScale = Math.max(0.2, 1 - (distFromGround / 150));
                    const shadowAlpha = Math.max(0.1, 0.4 * shadowScale);

                    ctx.save();
                    ctx.translate(15, this.h + distFromGround); // Position at ground level
                    ctx.scale(1, 0.3); // Flatten circle to ellipse
                    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, 15 * shadowScale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    // -------------------

                    const t = -state.animDistance;
                    let bodyRot = 0.45, bodyY = 0, neckRot = 0; const torsoLength = 28;
                    let thighL = 0, thighR = 0, calfL = 0, calfR = 0, ankleL = 0, ankleR = 0, armL = 0, armR = 0, foreArmL = 2.0, foreArmR = 2.0;

                    if (this.crouching) {
                        let progress = Math.min(1, this.slideTimer / 8); const ease = 1 - Math.pow(1 - progress, 3);
                        bodyRot = 0.45 + (-1.4 - 0.45) * ease; bodyY = 0 + (0 - 0) * ease; neckRot = 0 + (1.3 - 0) * ease;
                        thighR = 0.5 + (3.5 - 0.5) * ease; calfR = 0.2 + (0.1 - 0.2) * ease;
                        thighL = -0.5 + (-0.2 - -0.5) * ease; calfL = 0.2 + (1.5 - 0.2) * ease;
                        armL = 1.0 + (-2.2 - 1.0) * ease; armR = -1.0 + (-0.8 - -1.0) * ease;
                        foreArmL = 1.5; foreArmR = 1.5;
                        if (this.slideTimer > 6) { const vibe = Math.sin(Date.now() / 20) * 0.5; bodyY += vibe; thighR += vibe * 0.05; }
                    } else if (!this.grounded) {
                        neckRot = 0;
                        if (this.dy < -12) { bodyRot = 0.45; bodyY = -2; thighL = -1.1; calfL = 0.1; ankleL = 0.8; thighR = 1.9; calfR = 2.1; ankleR = 0.3; armL = -1.9; foreArmL = 0.8; armR = 1.3; foreArmR = 1.8; }
                        else if (this.dy < -10) { bodyRot = 0.4; bodyY = -5; thighL = -0.5; calfL = 0.4; ankleL = 0.6; thighR = 2.0; calfR = 2.2; ankleR = 0.2; armL = -1.7; foreArmL = 1.0; armR = 1.2; foreArmR = 1.7; }
                        else if (this.dy < 4) { bodyRot = 0.12; bodyY = -14; thighL = 2.2; calfL = 2.4; ankleL = 0.2; thighR = 2.2; calfR = 2.4; ankleR = 0.2; armL = -0.8; foreArmL = 1.7; armR = 0.3; foreArmR = 1.7; }
                        else { bodyRot = 0.2; bodyY = -6; thighL = 0.7; calfL = 0.4; ankleL = 0.5; thighR = 0.7; calfR = 0.4; ankleR = 0.5; armL = -1.4; foreArmL = 0.8; armR = 1.0; foreArmR = 0.8; }
                    } else if (state.playing) {
                        neckRot = 0; bodyY = Math.cos(t * 2) * 2 - Math.abs(Math.sin(t * 2)) * 1.5; bodyRot = 0.45 + Math.sin(t) * 0.08;
                        const strideAmp = 1.3; thighL = Math.sin(t) * strideAmp + Math.sin(t * 2) * 0.15; thighR = Math.sin(t + Math.PI) * strideAmp + Math.sin(t * 2 + Math.PI) * 0.15;
                        const getCalf = (p) => { const base = Math.cos(p); return base > 0 ? 0.1 : 0.1 + Math.pow(Math.abs(base), 1.5) * 2.8; };
                        calfL = getCalf(t); calfR = getCalf(t + Math.PI);
                        const getAnkle = (p) => { const phase = -Math.sin(p + 0.8); return phase > 0 ? 0.8 * phase : -0.4 * Math.abs(phase); };
                        ankleL = getAnkle(t); ankleR = getAnkle(t + Math.PI);
                        armL = Math.sin(t + Math.PI + 0.3) * 1.4; foreArmL = 1.8 + Math.sin(t * 2) * 0.2;
                        armR = Math.sin(t + 0.3) * 1.4; foreArmR = 1.8 + Math.sin(t * 2 + Math.PI) * 0.2;
                        if (Math.sin(t) > 0.95 || Math.sin(t + Math.PI) > 0.95) spawnDust(this.x, groundY, state.speed);
                    } else {
                        neckRot = 0; bodyRot = 0.1; bodyY = Math.sin(Date.now() / 300) * 1.5; thighL = 0.1; calfL = 0.1; thighR = -0.1; calfR = 0.1; armL = 0.2; foreArmL = 0.5; armR = -0.2; foreArmR = 0.5;
                    }

                    // Helper for Gradients
                    const getGrad = (x1, y1, x2, y2, c1, c2) => {
                        const g = ctx.createLinearGradient(x1, y1, x2, y2);
                        g.addColorStop(0, c1); g.addColorStop(1, c2); return g;
                    };

                    const drawLimb = (ox, oy, l1, l2, a1, bend, ankleRot, color, isLeg, darkColor) => {
                        // High Quality Limb with Joint Caps
                        ctx.lineWidth = isLeg ? 6 : 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

                        // Upper Limb
                        const kx = ox + Math.sin(a1) * l1; const ky = oy + Math.cos(a1) * l1;

                        // Gradient for 3D look
                        ctx.strokeStyle = color;
                        if (isLeg) ctx.strokeStyle = getGrad(ox, oy, kx, ky, color, darkColor || color);

                        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(kx, ky); ctx.stroke();

                        // Joint Cap (Knee/Elbow)
                        ctx.fillStyle = darkColor || color;
                        ctx.beginPath(); ctx.arc(kx, ky, isLeg ? 3 : 2.5, 0, Math.PI * 2); ctx.fill();

                        const jointAngle = isLeg ? (a1 - bend) : (a1 + bend);
                        const fx = kx + Math.sin(jointAngle) * l2; const fy = ky + Math.cos(jointAngle) * l2;

                        // Lower Limb
                        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();

                        if (isLeg) {
                            // Shoe
                            ctx.save(); ctx.translate(fx, fy); ctx.rotate(jointAngle + ankleRot + 0.3);
                            // Detail Shoe
                            ctx.fillStyle = colors.shoe;
                            ctx.beginPath(); ctx.ellipse(2, 3, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
                            ctx.fillStyle = colors.shoeSole; // Sole
                            ctx.fillRect(-2, 5, 12, 2.5);
                            // Shoe Detail
                            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(4, 4, 1.5, 0, Math.PI * 2); ctx.fill();
                            ctx.restore();
                        } else {
                            // Hand
                            ctx.fillStyle = colors.skin; ctx.beginPath(); ctx.arc(fx, fy, 4, 0, Math.PI * 2); ctx.fill();
                        }
                    };

                    const centerX = 15; const hipY = 28 + bodyY; const hipX = centerX - (Math.sin(bodyRot) * 3);
                    const shoulderX = hipX + Math.sin(bodyRot) * torsoLength; const shoulderY = hipY - Math.cos(bodyRot) * torsoLength;
                    const lenThigh = 15, lenCalf = 15; const lenArm = 12, lenForeArm = 12;

                    // Back Limbs
                    drawLimb(shoulderX - 4, shoulderY, lenArm, lenForeArm, armL + bodyRot, foreArmL, 0, colors.shirtDark, false, colors.shirtDark);
                    drawLimb(hipX - 3, hipY, lenThigh, lenCalf, thighL + bodyRot, calfL, ankleL, colors.pantsDark, true, colors.pantsDark);

                    // Torso with Gradient
                    ctx.save(); ctx.translate(hipX, hipY); ctx.rotate(bodyRot);

                    const torsoGrad = ctx.createLinearGradient(-6, 0, 6, 0); // Horizontal light
                    torsoGrad.addColorStop(0, colors.shirtDark);
                    torsoGrad.addColorStop(0.5, colors.shirt);
                    torsoGrad.addColorStop(1, colors.shirtDark);

                    ctx.fillStyle = torsoGrad;
                    ctx.beginPath(); ctx.moveTo(-6, 3); ctx.lineTo(6, 3);
                    ctx.lineTo(7, -torsoLength + 2); ctx.quadraticCurveTo(0, -torsoLength - 4, -7, -torsoLength + 2);
                    ctx.lineTo(-6, 3); ctx.fill();

                    // Belt / Separation
                    ctx.fillStyle = colors.pantsDark; ctx.fillRect(-6, 0, 12, 4);

                    // Shirt fold detail
                    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0, -torsoLength + 5); ctx.lineTo(0, -5); ctx.stroke();
                    ctx.restore();

                    // Head (High Quality)
                    const headBaseAngle = bodyRot + neckRot;
                    const headX = shoulderX + Math.sin(headBaseAngle) * 8; const headY = shoulderY - 8 - Math.cos(headBaseAngle) * 8;
                    ctx.save(); ctx.translate(headX, headY); ctx.rotate(headBaseAngle);

                    // Hair Back
                    ctx.fillStyle = colors.hair; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();

                    // Face Base with subtle gradient
                    const skinGrad = ctx.createRadialGradient(2, -2, 2, 0, 0, 12);
                    skinGrad.addColorStop(0, '#ffe0bd'); // Highlight
                    skinGrad.addColorStop(1, colors.skin);
                    ctx.fillStyle = skinGrad;
                    ctx.beginPath(); ctx.arc(2, 1, 8.5, 0, Math.PI * 2); ctx.fill();

                    // Awesome Hair Style (Spiky/Flowy)
                    ctx.fillStyle = colors.hair;
                    ctx.beginPath();
                    ctx.moveTo(-10, -5);
                    ctx.quadraticCurveTo(-15, -15, 0, -14); // Top Spike
                    ctx.quadraticCurveTo(10, -15, 8, -5);   // Front Spike
                    ctx.lineTo(8, -8); ctx.lineTo(2, 1);    // Sideburns
                    ctx.quadraticCurveTo(-4, -4, -10, -5);
                    ctx.fill();

                    // Modern Eye
                    ctx.fillStyle = '#1a252f'; ctx.beginPath(); ctx.ellipse(5, 0, 1.8, 3.2, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5.5, -1, 0.8, 0, Math.PI * 2); ctx.fill(); // Glint

                    // Smile
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(4, 5, 2.5, 0.2, Math.PI / 1.5, false); ctx.stroke();
                    ctx.restore();

                    // Front Limbs
                    drawLimb(hipX + 3, hipY, lenThigh, lenCalf, thighR + bodyRot, calfR, ankleR, colors.pants, true, colors.pantsDark);
                    drawLimb(shoulderX + 4, shoulderY, lenArm, lenForeArm, armR + bodyRot, foreArmR, 0, colors.shirt, false, colors.shirtDark);
                    ctx.restore();
                },

                update() {
                    this.dy += CONFIG.GRAVITY; this.y += this.dy;
                    if (this.y + this.h > groundY) {
                        if (!this.grounded && state.playing) spawnDust(this.x, groundY, state.speed);
                        this.y = groundY - this.h; this.dy = 0; this.grounded = true;
                    } else this.grounded = false;
                    if (this.crouching) this.slideTimer++; else this.slideTimer = 0;
                },

                jump() { if (this.grounded && !this.crouching) { this.dy = CONFIG.JUMP_FORCE; this.grounded = false; spawnDust(this.x, groundY, state.speed); AudioSys.playJump(); } },
                cutJump() { if (this.dy < -5) this.dy = -5; },
                fastFall() { if (!this.grounded) { this.dy = 25; this.crouching = true; } else { this.crouch(); } },
                crouch() { if (this.grounded) { this.crouching = true; this.h = 30; this.w = 20; spawnDust(this.x, groundY, state.speed); AudioSys.playSlide(); } },
                standUp() { this.crouching = false; this.h = 50; this.w = 30; }
            };
            const obstacles = [];
            class Obstacle {
                constructor() { this.active = false; }
                spawn(x, type) {
                    this.active = true; this.x = x; this.type = type; this.passed = false;
                    if (type === 'bench') { this.w = 70; this.h = 35; this.y = groundY - this.h; }
                    else { this.w = 6; this.h = ch; this.y = 0; this.safeGap = groundY - 80; }
                }
                draw() {
                    if (!this.active) return;
                    ctx.save(); ctx.translate(this.x, this.y);
                    if (this.type === 'bench') {
                        ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(231, 76, 60, 0.5)';
                        ctx.fillStyle = '#95a5a6'; ctx.fillRect(5, 8, 8, 27);
                        ctx.save(); ctx.translate(this.w - 5, 32); ctx.rotate(1.3); ctx.fillRect(0, 0, 8, 18); ctx.restore();
                        ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(this.w / 2, 0); ctx.lineTo(this.w / 2 + 2, 8); ctx.lineTo(0, 8); ctx.fill();
                        ctx.save(); ctx.translate(this.w / 2, 0); ctx.rotate(0.4); ctx.fillStyle = '#e74c3c'; ctx.fillRect(0, 0, this.w / 2, 8);
                        ctx.fillStyle = '#95a5a6'; ctx.fillRect(this.w / 2 - 13, 8, 8, 12); ctx.restore(); ctx.shadowBlur = 0;
                    } else {
                        ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(241, 196, 15, 0.6)'; ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4;
                        ctx.beginPath(); const ceilingY = groundY - 250; ctx.moveTo(3, ceilingY); ctx.lineTo(3, this.safeGap); ctx.stroke(); ctx.shadowBlur = 0;
                        ctx.fillStyle = '#444'; ctx.fillRect(-2, ceilingY, 10, 10);
                        if (state.playing && Math.random() > 0.7) {
                            ctx.save(); ctx.translate(3, this.safeGap); ctx.shadowBlur = 20; ctx.shadowColor = '#fff';
                            ctx.fillStyle = Math.random() > 0.5 ? '#ffff00' : '#ffffff'; const size = Math.random() * 5 + 3;
                            ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(0, 0); const angle = Math.random() * Math.PI * 2; ctx.lineTo(Math.cos(angle) * 15, Math.sin(angle) * 15); ctx.stroke(); }
                            ctx.restore();
                        }
                    }
                    ctx.restore();
                }
                update() {
                    this.x -= state.speed; if (this.x + this.w < 0) this.active = false;
                    if (!this.passed && this.x + this.w < player.x) {
                        this.passed = true; let reward = 0;
                        if (this.type === 'bench') { const gap = this.y - (player.y + player.h); if (gap > 0 && gap < 90 && player.dy < 10) reward = 25; }
                        else { if (player.crouching && player.slideTimer < 15) reward = 15; }
                        if (reward > 0) { state.score += reward; state.visualScore = Math.floor(state.score); scoreEl.innerText = state.visualScore; showFloatingText("CLOSE CALL! +" + reward, player.x, player.y - 40, 'bonus'); }
                    }
                }
            }

            function showFloatingText(text, x, y, type) {
                const el = document.createElement('div'); el.className = 'floating-text';
                if (type === 'room') el.className += ' text-room'; else if (type === 'floor') el.className += ' text-floor';
                else { el.className += ' text-bonus'; el.style.left = canvas.getBoundingClientRect().left + x + 'px'; el.style.top = canvas.getBoundingClientRect().top + y + 'px'; }
                el.innerText = text; document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
            }

            function showCharacterUnlock(name) {
                charNameText.innerText = name;
                charToast.classList.add('show');
                setTimeout(() => {
                    charToast.classList.remove('show');
                }, 2000);
            }

            for (let i = 0; i < 6; i++) obstacles.push(new Obstacle());
            let lastSpawnX = 0, animationId;

            function checkProgression() {
                if (state.visualScore >= state.nextRoomThreshold) {
                    state.roomNumber++;
                    state.nextRoomThreshold += CONFIG.ROOM_DISTANCE;
                    state.roomsClearedInFloor++;
                    state.spawnMilestoneDoor = true;

                    const nextChar = characterRoster[state.characterIndex % characterRoster.length];
                    showCharacterUnlock(nextChar.name);

                    if (state.roomsClearedInFloor >= 5) { state.floorNumber++; state.roomsClearedInFloor = 0; state.visualScore += 150; state.score += 150; state.bgHue = (state.bgHue + 50) % 360; floorEl.innerText = state.floorNumber; showFloatingText("FLOOR " + state.floorNumber + " REACHED!", 0, 0, 'floor'); showFloatingText("BONUS +150", 0, 0, 'room'); }
                    else { showFloatingText("LEVEL UP!", 0, 0, 'room'); }
                }
            }

            function gameLoop() {
                if (!state.playing && state.shakeTime <= 0) return;

                ctx.clearRect(0, 0, cw, ch);
                ctx.save();

                if (state.shakeTime > 0) {
                    state.shakeTime--;
                    const magnitude = (state.shakeTime / 20) * 10;
                    const dx = (Math.random() - 0.5) * magnitude;
                    const dy = (Math.random() - 0.5) * magnitude;
                    ctx.translate(dx, dy);
                }

                if (state.playing) state.animDistance += state.speed * 0.028;

                drawBackground(); drawFloor(); updateAndDrawParticles();

                if (state.playing) {
                    player.update();
                }
                player.draw();

                if (state.playing) {
                    if (state.speed > 12) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctx.lineWidth = 2;
                        for (let i = 0; i < 3; i++) { let lx = Math.random() * cw; let ly = Math.random() * ch; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 100, ly); ctx.stroke(); }
                    }
                    const minGap = 350 + state.speed * 15;
                    if (cw - lastSpawnX > minGap && Math.random() < 0.04) {
                        const o = obstacles.find(o => !o.active);
                        if (o) { o.spawn(cw, Math.random() > 0.55 ? 'bench' : 'wire'); lastSpawnX = cw; }
                    } else lastSpawnX -= state.speed;
                    let hit = false;
                    obstacles.forEach(o => {
                        if (o.active) {
                            o.update(); o.draw();
                            if (o.type === 'wire' && player.crouching) return;
                            if (player.x + 10 < o.x + o.w && player.x + player.w - 10 > o.x && player.y + 10 < o.y + o.h - 5 && player.y + player.h - 5 > o.y + 5) hit = true;
                        }
                    });
                    if (hit) { gameOver(); /* return removed to allow draw to finish */ }
                    else {
                        state.score += 0.05; state.visualScore = Math.floor(state.score); checkProgression();
                        if (state.frame % 60 === 0) {
                            const progression = Math.min(1, state.score / 10000);
                            const speedRange = CONFIG.SPEED_MAX - CONFIG.SPEED_START;
                            state.speed = CONFIG.SPEED_START + (progression * speedRange);
                            const speedRatio = state.speed / CONFIG.SPEED_MAX;
                            CONFIG.GRAVITY = 0.8 + (speedRatio * 0.45);
                            CONFIG.JUMP_FORCE = -18 - (speedRatio * 4);
                        }
                    }
                } else {
                    // Draw static obstacles if not playing
                    obstacles.forEach(o => { if (o.active) o.draw(); });
                }

                state.frame++; scoreEl.innerText = state.visualScore;
                ctx.restore();

                // Continue loop if playing OR shaking
                if (state.playing || state.shakeTime > 0) {
                    animationId = requestAnimationFrame(gameLoop);
                }
            }

            function drawFloor() {
                const ceilingY = groundY - 250;
                ctx.fillStyle = `hsla(${state.bgHue}, 20%, 10%, 0.8)`; ctx.fillRect(0, ceilingY - 10, cw, 10);
                ctx.strokeStyle = `hsla(${state.bgHue}, 70%, 70%, 0.3)`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, ceilingY); ctx.lineTo(cw, ceilingY); ctx.stroke();

                ctx.strokeStyle = `hsla(${state.bgHue}, 60%, 60%, 0.1)`; ctx.lineWidth = 1; let offset = -(state.animDistance * 50) % 50;
                for (let i = 0; i < cw / 50; i++) { ctx.beginPath(); ctx.moveTo(i * 50 + offset, groundY); ctx.lineTo(i * 50 + offset - 100, groundY + 150); ctx.stroke(); }

                ctx.strokeStyle = `hsla(${state.bgHue}, 70%, 70%, 0.8)`; ctx.lineWidth = 4; ctx.shadowBlur = 10; ctx.shadowColor = `hsla(${state.bgHue}, 70%, 70%, 1)`;
                ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(cw, groundY); ctx.stroke(); ctx.shadowBlur = 0;
            }

            function drawStaticScene() { ctx.clearRect(0, 0, cw, ch); drawBackground(); drawFloor(); player.y = groundY - player.h; player.draw(); }
            function startGame() {
                state.playing = true; state.isGameOver = false; state.score = 0; state.visualScore = 0; state.speed = CONFIG.SPEED_START; state.frame = 0; state.animDistance = 0; lastSpawnX = 0;
                state.roomNumber = 101; state.floorNumber = 1; state.roomsClearedInFloor = 0; state.nextRoomThreshold = CONFIG.ROOM_DISTANCE; state.bgHue = 220; state.spawnMilestoneDoor = false;

                // RESET CHARACTER TO GOVIND
                state.characterIndex = 0;
                showCharacterUnlock(characterRoster[0].name);

                roomEl.innerText = state.roomNumber; floorEl.innerText = state.floorNumber; scoreEl.innerText = 0;
                particles.length = 0; bgObjects.length = 0; document.querySelectorAll('.floating-text').forEach(e => e.remove());
                player.y = groundY - player.h; player.dy = 0; player.grounded = true; player.standUp();
                obstacles.forEach(o => o.active = false); modal.style.display = 'none'; startScreen.style.display = 'none';
                AudioSys.init(); toggleMusic(true);
                gameLoop();
            }
            function gameOver() {
                state.playing = false; state.isGameOver = true;
                state.shakeTime = 20;
                // cancelAnimationFrame(animationId); // Removed to allow shake loop
                AudioSys.playGameOver(); toggleMusic(false);
                if (state.visualScore > state.highScore) { state.highScore = state.visualScore; localStorage.setItem('cc_hallway_hiscore', state.highScore); highScoreEl.innerText = state.highScore; }
                finalScoreEl.innerText = Math.floor(state.score); deathReasonEl.innerText = FAIL_MESSAGES[Math.floor(Math.random() * FAIL_MESSAGES.length)]; modal.style.display = 'block';
            }
            function inputAction(e) {
                if (state.isGameOver) return; if (!state.playing) { startGame(); return; }
                const t = e.touches ? e.touches[0] : null;
                if (t && t.clientX < innerWidth / 2) player.fastFall(); else if (t) player.jump();
                else { if (e.type === 'keydown' && e.code === 'ArrowDown') player.fastFall(); else player.jump(); }
            }
            addEventListener('touchstart', (e) => { if (state.isGameOver) return; if (!state.playing) { startGame(); return; } const t = e.touches[0]; if (t.clientX < innerWidth / 2) player.fastFall(); else player.jump(); }, { passive: false });
            addEventListener('touchend', (e) => { player.standUp(); player.cutJump(); });
            addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); player.jump(); } if (e.code === 'ArrowDown') { e.preventDefault(); player.fastFall(); } });
            addEventListener('keyup', e => { if (e.code === 'ArrowDown') player.standUp(); if (e.code === 'Space' || e.code === 'ArrowUp') player.cutJump(); });
            retryBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });
            resize();
        })();
    </script>
</body>
