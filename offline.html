<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CampusCare</title>
    
    <style>
        /* --- EMBEDDED CSS (NO EXTERNAL DEPENDENCIES) --- */
        :root {
            --bg: #0b1020;
            --text: #e7ecff;
            --muted: #8fa0c9;
            --accent: #6ea8fe;
            --card-bg: rgba(19, 26, 43, 0.8);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #0b1020, #101631);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(110, 168, 254, 0.15) 0%, transparent 60%);
            filter: blur(80px);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s ease-out forwards;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        h1 { margin: 0 0 10px; font-size: 24px; color: white; }
        p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }

        .btn {
            display: block; width: 100%; padding: 14px; margin-bottom: 10px;
            border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; border: none; transition: transform 0.2s;
            box-sizing: border-box; text-decoration: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #4a8adb); color: #071226; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: white; }
        .btn-danger { background: rgba(231, 76, 60, 0.2); color: #ff9e93; border: 1px solid rgba(231, 76, 60, 0.4); }

        /* FORM STYLES */
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 14px; }
        input, textarea, select {
            width: 100%; padding: 12px; background: #0b1020; border: 1px solid #2a3558;
            border-radius: 10px; color: white; box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        
        .hero-icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <div class="glass-card">
        
        <div id="view-menu">
            <div class="hero-icon">📡</div>
            <h1>Connection Lost</h1>
            <p>You seem to be offline.</p>

            <div id="admin-msg" class="hidden">
                <p style="color:#ff9e93; background:rgba(231,76,60,0.1); padding:10px; border-radius:8px;">Admin access requires internet.</p>
                <button onclick="window.location.reload()" class="btn btn-primary">🔄 Try Reconnecting</button>
            </div>

            <div id="student-msg" class="hidden">
                <p style="color:#6ef5a3; background:rgba(39,174,96,0.1); padding:10px; border-radius:8px;">Don't worry! Report damages here.</p>
                <button onclick="showReportForm()" class="btn btn-primary">📝 Report Damage Now</button>
                <a href="views/student/dashboard.php" class="btn btn-outline">🏠 Dashboard</a>
            </div>

            <div id="default-msg" class="hidden">
                <button onclick="window.location.reload()" class="btn btn-primary">🔄 Reload</button>
            </div>
        </div>

        <div id="view-form" class="hidden">
            <h2 style="color:white; margin-top:0;">📝 Report Issue</h2>
            <form id="offlineReportForm">
                <div class="form-group">
                    <label>Issue Title</label>
                    <input type="text" id="r_title" required placeholder="e.g. Broken Fan">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="r_desc" rows="3" required placeholder="Details..."></textarea>
                </div>
                <input type="hidden" id="r_date" value="">
                
                <button type="submit" class="btn btn-primary">💾 Save Offline</button>
                <button type="button" onclick="showMenu()" class="btn btn-danger">❌ Cancel</button>
            </form>
        </div>

        <div id="view-success" class="hidden">
            <div class="hero-icon">✅</div>
            <h2 style="color:white;">Saved!</h2>
            <p>Your report is saved on this device. It will upload automatically when internet returns.</p>
            <button onclick="showMenu()" class="btn btn-outline">Back to Menu</button>
        </div>

    </div>

    <script>
        // --- 1. NAVIGATION LOGIC ---
        function showMenu() {
            document.getElementById('view-menu').classList.remove('hidden');
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-success').classList.add('hidden');
        }

        function showReportForm() {
            document.getElementById('view-menu').classList.add('hidden');
            document.getElementById('view-form').classList.remove('hidden');
            // Auto-fill date
            document.getElementById('r_date').value = new Date().toISOString().split('T')[0];
        }

        function showSuccess() {
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-success').classList.remove('hidden');
        }

        // --- 2. ROLE CHECKER ---
        document.addEventListener("DOMContentLoaded", function() {
            const role = localStorage.getItem('userRole');
            
            document.getElementById('admin-msg').classList.add('hidden');
            document.getElementById('student-msg').classList.add('hidden');
            document.getElementById('default-msg').classList.add('hidden');

            if (role === 'admin' || role === 'faculty') {
                document.getElementById('admin-msg').classList.remove('hidden');
            } else if (role === 'student') {
                document.getElementById('student-msg').classList.remove('hidden');
            } else {
                document.getElementById('default-msg').classList.remove('hidden');
            }
        });

        // --- 3. SAVE TO INDEXEDDB (The Real Magic) ---
        // This puts data where the Service Worker can find it later
        const DB_NAME = 'campuscare_db';
        const STORE_NAME = 'offline_reports';

        document.getElementById('offlineReportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const reportData = {
                title: document.getElementById('r_title').value,
                description: document.getElementById('r_desc').value,
                date: new Date().toISOString(),
                user_id: localStorage.getItem('userId') || 'unknown', // Ensure you have userId in localStorage
                status: 'pending_sync'
            };

            const request = indexedDB.open(DB_NAME, 1);
            
            request.onupgradeneeded = function(event) {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { autoIncrement: true });
                }
            };

            request.onsuccess = function(event) {
                const db = event.target.result;
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                
                store.add(reportData);
                
                tx.oncomplete = function() {
                    // Register Sync if supported (Optional but good)
                    if ('serviceWorker' in navigator && 'SyncManager' in window) {
                        navigator.serviceWorker.ready.then(function(swRegistration) {
                            return swRegistration.sync.register('sync-new-reports');
                        });
                    }
                    showSuccess();
                    document.getElementById('offlineReportForm').reset();
                };
            };
        });
    </script>
</body>
</html>
