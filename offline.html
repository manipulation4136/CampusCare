<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CampusCare</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="offline-page">
    <div class="offline-container">
        <div class="offline-content">
            <div class="icon-box">
                <h1>📡</h1>
            </div>
            <h2>You are Offline</h2>

            <div id="admin-msg" class="hidden">
                <p class="offline-text">Admin access requires an active internet connection.</p>
                <button onclick="window.location.reload()" class="btn btn-primary">🔄 Try Reconnecting</button>
            </div>

            <div id="student-msg" class="hidden">
                <p class="offline-text">Don't worry! You can still report damages.</p>
                <div class="button-group">
                    <a href="/views/student/report_new.php" class="btn btn-success">📝 Report Damage</a>
                    <a href="/views/student/dashboard.php" class="btn btn-secondary">🏠 Dashboard</a>
                </div>
            </div>

            <div id="default-msg" class="hidden">
                <p class="offline-text">Please check your internet connection.</p>
                <button onclick="window.location.reload()" class="btn btn-primary">🔄 Reload</button>
            </div>
        </div>
    </div>

    <script>
        // Check Role and Show Relevant Message
        const role = localStorage.getItem('userRole');

        if (role === 'admin' || role === 'faculty') {
            document.getElementById('admin-msg').classList.remove('hidden');
        } else if (role === 'student') {
            document.getElementById('student-msg').classList.remove('hidden');
        } else {
            document.getElementById('default-msg').classList.remove('hidden');
        }
    </script>
</body>

</html>
